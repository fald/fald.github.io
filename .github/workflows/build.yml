name: Build and Deploy Portfolio

# Even though most of this won't come up, good hygeine.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# concurrency is probably also good hygeine, but there are 
# limits to how inefficient I want to be for the sake of 
# completion lol

permissions:
  contents: read

jobs:
  # let's separate tests out, though
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      # Very basic builtin validation
      # nullglob: expansion patterns that don't match are removed
      - name: Validate JSON
        run: |
          shopt -s nullglob
          for f in data/*.json data/projects/*.json; do
            echo "checking $f"
            python -m json.tool "$f" > /dev/null
          done

      # Every project in data/projects.json should have a data file?
      # TODO: Only later, for now, empty is fine. Also, own test file, probably
      # - name: Check referenced project files exist
      #   run: |
          # python - <<'EOF'
          # import json, pathlib, sys
          # listed = json.loads(pathlib.Path("data/projects.json").read_text(encoding="utf-8"))["projects"]
          # missing = [p for p in listed if not pathlib.Path(f"data/projects/{p}.json").exists()]
          # if missing:
          #     sys.exit(f"Missing project data files: {missing}")
          # EOF

      # TODO: Once unit tests are up
      # - name: Run unit tests
      #   if: ${{ hashFiles('tests/**/*.py') != ''}}
      #   run: python -m pytest -q


  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build resume
        run: |
          python scripts/build_resume.py \
          --profile base \
          --format md html

      - name: Build resume PDF
        run: |
          python scripts/build_resume_pdf.py

      - name: Build website
        run: |
          python scripts/build_site.py

      # Should this be in a separate job?
      - name: Validate build outputs
        run: |
          test -f index.html
          test -f contact.html
          test -f resume/index.html
          test -f projects/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: 
          # TODO: Limit this to not include scripts, data, templates, requirements, etc.
          path: .


  # test:


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to Github pages
        id: deployment
        uses: actions/deploy-pages@v5
