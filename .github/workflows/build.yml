name: Build and Deploy Portfolio

# Even though most of this won't come up, good hygeine.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# concurrency is probably also good hygeine, but there are 
# limits to how inefficient I want to be for the sake of 
# completion lol

permissions:
  contents: read

jobs:
  # let's separate tests out, though
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      # Very basic builtin validation
      # nullglob: expansion patterns that don't match are removed
      - name: Validate JSON
        run: |
          shopt -s nullglob
          for f in data/*.json data/projects/*.json; do
            echo "checking $f"
            python -m json.tool "$f" > /dev/null
          done

      # Every project in data/projects.json should have a data file?
      # TODO: Only later, for now, empty is fine. Also, own test file, probably
      # - name: Check referenced project files exist
      #   run: |
          # python - <<'EOF'
          # import json, pathlib, sys
          # listed = json.loads(pathlib.Path("data/projects.json").read_text(encoding="utf-8"))["projects"]
          # missing = [p for p in listed if not pathlib.Path(f"data/projects/{p}.json").exists()]
          # if missing:
          #     sys.exit(f"Missing project data files: {missing}")
          # EOF

      # TODO: Once unit tests are up
      # - name: Run unit tests
      #   if: ${{ hashFiles('tests/**/*.py') != ''}}
      #   run: python -m pytest -q


  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15 # frankly, timeouts should probably be way lower

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}=${{ hashFiles('requirements.txt') }}
        
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build resume (Markdown, HTML)
        run: python scripts/build_resume.py

      - name: Build resume (PDF)
        run: python scripts/build_resume_pdf.py

      # TODO: Include fail on warning? Or just look at
      # the actions output?
      - name: Build website
        run: python scripts/build_site.py


      # Publish only necessary pages -
      # Other stuff accessible from the public repo,
      # but still.
      # Might have been better to build the separate _site folder in build_site? Whatever.
      - name: Assemble site
        run: |
          mkdir -p _site/resume
          cp index.html contact.html _site/
          cp -r assets projects _site/
          cp resume/index.html _site/resume


      # Should this be in the test job?
      # Also, test -all- expected files? (TODO: )
      - name: Validate build output
        run: |
          test -f _site/index.html
          test -f _site/contact.html
          test -f _site/resume/index.html
          test -f _site/projects/index.html
          test -f _site/assets/css/main.css
          test -f _site/assets/images/favicon.ico
          test -f _site/assets/files/Firas-Aldabbas.pdf
          # Loose template placeholders
          # Annoyingly, might have to tweak it a bit because of possible pipeline issues? I dunno.
          (! grep -rnq --include='*.html' '{{' _site)
          # Empty images
          (! grep -rnq --include='*.html' 'src=""' _site)
          # Drafting comments? Don't know a good way that doesn't also exclude regular comments, so skip. Manual.

      # Internal links, images/stylesheets.
      # Can't find a standard action, don't wanna use whatever lychee is, so...manual.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: 
          path: _site


  deploy:
    # Don't deploy from PR - as noted above, I don't foresee this mattering
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to Github pages
        id: deployment
        uses: actions/deploy-pages@v5
